<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Todo</h1>

    <form id="add-form" novalidate>
      <label for="task-input">New task</label>
      <input id="task-input" type="text" autocomplete="off" aria-describedby="task-error">
      <button type="submit">Add</button>
    </form>

    <p id="task-error" role="alert"></p>

    <p id="empty-state">No tasks yet. Add one above.</p>
    <ul id="task-list"></ul>

    <noscript>This app needs JavaScript to work. Please enable JavaScript and reload the page.</noscript>
  </main>

  <script src="todo-logic.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
